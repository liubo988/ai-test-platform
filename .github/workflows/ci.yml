name: CI

on:
  pull_request:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CI: true
  NEXT_TELEMETRY_DISABLED: '1'
  APP_CRYPTO_KEY: ci-local-app-crypto-key

jobs:
  generated-artifacts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Regenerate generated integration specs
        run: npm run edge:generate
      - name: Verify generated specs are committed
        run: |
          if [ -n "$(git status --porcelain -- tests/integration/generated)" ]; then
            echo "Generated integration specs changed. Run 'npm run edge:generate' and commit the result."
            git status --short -- tests/integration/generated
            exit 1
          fi

  static-and-unit:
    runs-on: ubuntu-latest
    needs: generated-artifacts
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Check stable docs links
        run: node scripts/check-doc-links.mjs
      - name: Check intent-e2e roadmap progress template
        run: node scripts/check-roadmap-progress.mjs
      - name: Preflight intent-e2e release guard assets
        run: npm run intent:release-guard:preflight
      - name: Check intent-e2e knowledge hit evidence
        run: npm run intent:knowledge-hit-guard
      - name: Write intent-e2e release readiness summary
        run: npm run intent:release-summary -- --skip-current-compare --title "Intent E2E Release Readiness (CI static evidence)" --github-step-summary
      - name: Upload intent-e2e release readiness summary
        uses: actions/upload-artifact@v4
        with:
          name: intent-e2e-release-readiness
          path: reports/ci/intent-e2e-release-readiness.*
          if-no-files-found: error
      - name: Check architectural boundaries
        run: bash scripts/check-boundaries.sh
      - run: npm run build
      - run: npm run build:web
      - run: npm run test:unit

  integration:
    runs-on: ubuntu-latest
    needs: static-and-unit
    timeout-minutes: 20
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: ai_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      DB_HOST: 127.0.0.1
      DB_USER: root
      DB_PASSWORD: root
      DB_NAME: ai_test
      DB_PORT: 3306
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Write CI .env
        run: |
          cat > .env <<'EOF'
          DB_HOST=127.0.0.1
          DB_USER=root
          DB_PASSWORD=root
          DB_NAME=ai_test
          DB_PORT=3306
          DB_POOL_SIZE=10
          APP_CRYPTO_KEY=ci-local-app-crypto-key
          OPENAI_API_KEY=
          OPENAI_MODEL=api-proxy-codex/gpt-5.3-codex
          OPENAI_BASE_URL=https://api.openai.com/v1
          EOF
      - run: npm run db:init
      - run: npm run test:integration

  e2e:
    runs-on: ubuntu-latest
    needs: static-and-unit
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps
      - run: npm run test:e2e
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          if-no-files-found: ignore
